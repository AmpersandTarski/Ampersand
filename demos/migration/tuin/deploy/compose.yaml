# A system of contexts: Migratie, Tuin, Tuin.
# Generated by `ampersand deploy`.
#
# Every database has an application of its own, on one database server.
# The name of a database comes from the environment, with the name in the script as the default; see .env.example.
#
#   docker compose up -d --build
#   ./install.sh
volumes:
  db-data:

services:
  migratie:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/migratie/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tuin1:
        condition: service_started
      tuin2:
        condition: service_started
    ports:
      - "${MIGRATIE_PORT:-8080}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${MIGRATIE_DBNAME:-Migratie}
      - AMPERSAND_SERVER_URL=http://localhost:${MIGRATIE_PORT:-8080}
      - AMPERSAND_CONTEXT_DBNAMES=Tuin_1=${TUIN1_DBNAME:-Tuin_1};Tuin_2=${TUIN2_DBNAME:-Tuin_2}

  tuin1:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/tuin1/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TUIN1_PORT:-8081}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${TUIN1_DBNAME:-Tuin_1}
      - AMPERSAND_SERVER_URL=http://localhost:${TUIN1_PORT:-8081}

  tuin2:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/tuin2/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TUIN2_PORT:-8082}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${TUIN2_DBNAME:-Tuin_2}
      - AMPERSAND_SERVER_URL=http://localhost:${TUIN2_PORT:-8082}

  db:
    image: mariadb:12.3
    restart: unless-stopped
    command: ["--lower-case-table-names=1", "--sql-mode=ANSI,TRADITIONAL"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ampersand}
      - MYSQL_USER=ampersand
      - MYSQL_PASSWORD=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      # Upgrades the system tables of a database volume made by an older MariaDB at startup.
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uampersand", "-p${MYSQL_AMPERSAND_PASSWORD:-ampersand}", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 45
