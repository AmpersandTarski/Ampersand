# A system of contexts: Migration, Kurk, Kurk.
# Generated by `ampersand deploy`.
#
# Every context has an application of its own and a database of its own, on one database server.
# The name of a database comes from the environment; see .env.example.
#
#   docker compose up -d --build
#   ./install.sh
volumes:
  db-data:

services:
  migration:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/migration/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      old:
        condition: service_started
      new:
        condition: service_started
    ports:
      - "${MIGRATION_PORT:-8080}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${MIGRATION_DBNAME:-migration_1}
      - AMPERSAND_SERVER_URL=http://localhost:${MIGRATION_PORT:-8080}
      - AMPERSAND_CONTEXT_DBNAMES=old=${OLD_DBNAME:-kurk_1};new=${NEW_DBNAME:-kurk_2}

  old:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/old/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OLD_PORT:-8081}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${OLD_DBNAME:-kurk_1}
      - AMPERSAND_SERVER_URL=http://localhost:${OLD_PORT:-8081}

  new:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/new/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NEW_PORT:-8082}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${NEW_DBNAME:-kurk_2}
      - AMPERSAND_SERVER_URL=http://localhost:${NEW_PORT:-8082}

  db:
    image: mariadb:10.6
    restart: unless-stopped
    command: ["--lower-case-table-names=1", "--sql-mode=ANSI,TRADITIONAL"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ampersand}
      - MYSQL_USER=ampersand
      - MYSQL_PASSWORD=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uampersand", "-p${MYSQL_AMPERSAND_PASSWORD:-ampersand}", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 45
