# A system of contexts: Migration, Kurk, Kurk.
# Generated by `ampersand deploy`.
#
# Every database has an application of its own, on one database server.
# The name of a database comes from the environment, with the name in the script as the default; see .env.example.
#
#   docker compose up -d --build
#   ./install.sh
volumes:
  db-data:

services:
  migration:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/migration/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kurk1:
        condition: service_started
      kurk2:
        condition: service_started
    ports:
      - "${MIGRATION_PORT:-8080}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${MIGRATION_DBNAME:-Migration}
      - AMPERSAND_SERVER_URL=http://localhost:${MIGRATION_PORT:-8080}
      - AMPERSAND_CONTEXT_DBNAMES=Kurk_1=${KURK1_DBNAME:-Kurk_1};Kurk_2=${KURK2_DBNAME:-Kurk_2}

  kurk1:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/kurk1/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KURK1_PORT:-8081}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${KURK1_DBNAME:-Kurk_1}
      - AMPERSAND_SERVER_URL=http://localhost:${KURK1_PORT:-8081}

  kurk2:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/kurk2/Dockerfile
      args:
        - FRAMEWORK_IMAGE=${FRAMEWORK_IMAGE:-ampersandtarski/prototype-framework:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KURK2_PORT:-8082}:80"
    environment:
      - AMPERSAND_DEBUG_MODE=${AMPERSAND_DEBUG_MODE:-true}
      - AMPERSAND_DBHOST=db
      - AMPERSAND_DBUSER=ampersand
      - AMPERSAND_DBPASS=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      - AMPERSAND_DBNAME=${KURK2_DBNAME:-Kurk_2}
      - AMPERSAND_SERVER_URL=http://localhost:${KURK2_PORT:-8082}

  db:
    image: mariadb:12.3
    restart: unless-stopped
    command: ["--lower-case-table-names=1", "--sql-mode=ANSI,TRADITIONAL"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ampersand}
      - MYSQL_USER=ampersand
      - MYSQL_PASSWORD=${MYSQL_AMPERSAND_PASSWORD:-ampersand}
      # Upgrades the system tables of a database volume made by an older MariaDB at startup.
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uampersand", "-p${MYSQL_AMPERSAND_PASSWORD:-ampersand}", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 45
