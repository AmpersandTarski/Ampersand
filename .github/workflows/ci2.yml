# Inspired by https://tech.freckle.com/2021/05/18/haskell-on-actions/
name: Build and test 🚀
on:
  push:
    branches:
      - "**" # Only trigger on branches (i.e. not tags, ..)
jobs:
  changes:
    # Build kernel: only changes to what the compiler build actually consumes
    # should start a (re)build. Update this list only when you change what goes
    # into the build. Everything else (docs, memorybank, ReleaseNotes.md, READMEs,
    # the other workflow files) skips the heavy jobs on purpose.
    # The filter is a job, and no longer a `paths:` filter on the workflow,
    # because branch protection requires the heavy jobs: a workflow that does not
    # start leaves its checks pending for ever and blocks the merge, while a job
    # that its `if:` skips counts as passed (GitHub docs, "Handling skipped but
    # required checks"). On a branch the filter compares with the merge-base
    # with main, on main with the commit before the push (the default base of
    # dorny/paths-filter), so a branch that changed the build keeps building
    # until it is merged.
    name: Detect changes to the build
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout project contents 📡
        uses: actions/checkout@v5
      - name: Compare with the base
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - "src/**"
              - "app/**"
              - "AmpersandData/**"      # bundled into the binary (extra-source-files)
              - "outputTemplates/**"    # bundled into the binary (extra-source-files)
              - "testing/**"            # test-suite inputs
              - "package.yaml"
              - "ampersand.cabal"
              - "stack.yaml"
              - "stack.yaml.lock"
              - "Setup.hs"
              - "Dockerfile"
              - ".dockerignore"
              - ".hlint.yaml"
              - "weeder.dhall"
              - "hie.yaml"
              - ".github/workflows/ci2.yml"  # a change to this workflow is tested by running it
  build-and-test-docker:
    name: Build with Docker
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    env:
      DOCKER_AMPERSAND_IMAGE: ampersandtarski/ampersand
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare for docker
        run: |
          echo Running on branch ${GITHUB_REF##*/}
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build with Buildx so the dependency layer (231 packages / ~24 min from scratch)
      # is restored from the shared GitHub Actions cache instead of recompiled every run.
      # `load: true` keeps the image in the local docker so the main-only push step below works.
      - name: Build final image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.DOCKER_AMPERSAND_IMAGE }}:latest
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_Branch=${{ github.ref }}
          cache-from: type=gha,scope=ampersand-image
          cache-to: type=gha,mode=max,scope=ampersand-image

      # For main branch push latest to DockerHub
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Push latest
        if: github.ref == 'refs/heads/main'
        run: docker push ${DOCKER_AMPERSAND_IMAGE}:latest

  build-and-test-ubuntu:
    name: Build and test on Linux 🏗 🧪
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout project contents 📡
        uses: actions/checkout@v5
      - name: Install system libraries 🧰
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev
      - name: Set up Mariadb 🧰
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "mariadb-11.5"
      - name: Build and test 🏗 🧪
        uses: freckle/stack-action@v5 # stack-action does all these steps: dependencies, build, test.
        with:
          stack-build-arguments: "--copy-bins --flag ampersand:buildAll"
          upgrade-stack: false
          cache-save-always: true

  build-and-test-windows:
    name: Build and test on Windows 🏗 🧪
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - name: Checkout project contents 📡
        uses: actions/checkout@v5
      - name: Use cache (manually) 📦 # See https://github.com/freckle/stack-cache-action/issues/5
        uses: actions/cache@v4
        # TODO: Cache might be done better, see for inspiration:  https://github.com/godu/advent-of-code-2020/blob/46796832f59d185457a8edf8de043a54a451d688/.github/workflows/ci.yml
        with:
          path: |
            ~/.ghc
            ~/.stack
            ~/.stack-work
          key: ${{ runner.os }}-stack
      - name: Set up Mariadb 🧰
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "mariadb-11.5"
      - name: Setup PHP 🧰
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          extensions: mysqli
      - name: Build and test 🏗 🧪
        uses: freckle/stack-action@v5
        with:
          stack-build-arguments: "--copy-bins --flag ampersand:buildAll"
          upgrade-stack: false
          cache-save-always: true
